
trigger:
- main

# Replace with your actual Windows agent pool name
pool:
  name: app-agent-pool

variables:
  nodeVersion: '22.x'

stages:
  - stage: CI
    displayName: 'Frontend Continuous Integration'

    jobs:
      - job: Build
        displayName: 'Build Axion Frontend'

        steps:
          - checkout: self
            clean: true

          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: |
                ssh -i C:\Users\shiva.rai\Downloads\Devops\ssh-key\test.pem azureuser@104.42.217.83
                
                
                npm install -D esbuild@^0.28.0
                
                npm run build
          - script: npm install -D esbuild@^0.28.0
            displayName: 'Install Dependencies'

          - script: npm run build
            displayName: 'Build Production Frontend'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Frontend Artifact'
            inputs:
              targetPath: '$(Build.SourcesDirectory)/dist'
              artifact: 'frontend-dist'
              publishLocation: 'pipeline'
