  trigger:
    - main

  pool:
    name: app-agent-pool

  steps:
    # 1. Checkout code on Windows agent
    - checkout: self
      clean: true
    # 3. Build and deploy on Azure Linux VM
    - task: SSH@0
      displayName: 'Build and Deploy on Azure VM'
      inputs:
        sshEndpoint: 'Azure-Linux-VM-SSH'
        runOptions: inline
        interpreterCommand: /bin/bash
        failOnStdErr: false
        inline: |
          set -e

          mkdir -p /home/azureuser/frontend
          tar -xzf /home/azureuser/source.tar.gz -C /home/azureuser/frontend

          cd /home/azureuser/frontend

          npm install -D esbuild@^0.28.0
          npm run build

          sudo rsync -av --delete dist/ /var/www/html/

          echo "Frontend deployed successfully"