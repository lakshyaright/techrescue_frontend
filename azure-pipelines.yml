
trigger:
  - main

pool:
  name: app-agent-pool

steps:
  - checkout: none

  - task: SSH@0
    displayName: 'Build and Deploy on Azure VM'
    inputs:
      sshEndpoint: 'Azure-Linux-VM-SSH'
      runOptions: 'inline'
      inline: |
        set -e
        
        
        sudo apt update && sudo apt upgrade -y
        sudo apt install -y curl wget git build-essential ufw nginx
        
        cd /home/azureuser
        
        if [ -d techrescue_frontend/.git ]; then
          cd techrescue_frontend
          git pull origin main
        else
          git clone --branch main https://github.com/lakshyaright/techrescue_frontend.git
          cd techrescue_frontend
        fi
        npm install
        npm run build
        
        sudo rsync -av --delete dist/ /var/www/html/
        
        echo "Frontend deployed successfully"
      failOnStdErr: false
      readyTimeout: '20000'
